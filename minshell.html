<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>C3 Snake</title>

	<meta name="description" content="A snake game built with C3 &amp; Raylib.">
	<meta property="og:url" content="https://manulinares.github.io/c3-snake/">
	<meta property="og:type" content="website">
	<meta property="og:title" content="C3 Snake">
	<meta property="og:description" content="A snake game built with C3 &amp; Raylib.">
	<meta property="og:image" content="https://manulinares.github.io/c3-snake/preview.jpg">
	<meta property="og:image:type" content="image/jpeg">
	<meta property="og:image:width" content="872">
	<meta property="og:image:height" content="624">
	<meta property="og:image:alt" content="C3 Snake Gameplay Preview">
	<meta name="twitter:card" content="summary_large_image">
	<meta property="twitter:domain" content="manulinares.github.io">
	<meta property="twitter:url" content="https://manulinares.github.io/c3-snake/">
	<meta name="twitter:title" content="C3 Snake">
	<meta name="twitter:description" content="A snake game built with C3 &amp; Raylib.">
	<meta name="twitter:image" content="https://manulinares.github.io/c3-snake/preview.jpg">

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap"
		rel="stylesheet">
	<style>
		:root {
			--bg: #0b0b0e;
			--pink: #ff00ff;
		}

		body {
			margin: 0;
			overflow: hidden;
			background: var(--bg);
			font-family: 'Inter', sans-serif;
			color: #fff;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
		}

		.game {
			background: rgba(255, 255, 255, 0.03);
			padding: 20px;
			border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.1);
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			margin-bottom: 20px;
		}

		.header h1 {
			margin: 0;
			font-size: 20px;
			background: linear-gradient(90deg, #00d2ff, #3a7bd5);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.controls {
			font-size: 11px;
			font-family: 'JetBrains Mono', monospace;
			opacity: 0.4;
			letter-spacing: 0.5px;
		}

		canvas {
			display: block;
			border-radius: 4px;
			box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
			outline: none;
			image-rendering: pixelated;
		}

		canvas:fullscreen { width: 100vw; height: 100vh; object-fit: contain; }
		canvas:-webkit-full-screen { width: 100vw; height: 100vh; object-fit: contain; }

		#overlay {
			position: absolute;
			top: 0; left: 0;
			width: 100%; height: 100%;
			background: rgba(0, 0, 0, 0.85);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 1000;
			backdrop-filter: blur(10px);
			cursor: pointer;
		}

		#overlay h2 {
			font-size: 32px;
			letter-spacing: 4px;
			background: linear-gradient(90deg, #00d2ff, #3a7bd5);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin: 0;
		}

		#overlay p {
			margin-top: 10px;
			font-size: 11px;
			opacity: 0.4;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		#log {
			margin-top: 15px;
			font-family: 'JetBrains Mono', monospace;
			font-size: 9px;
			opacity: 0.1;
			text-align: center;
		}

		.footer {
			margin-top: 25px;
			font-size: 11px;
			opacity: 0.3;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.footer a {
			color: var(--pink);
			text-decoration: none;
			font-weight: 700;
		}

		.footer a:hover {
			color: #ff6bff;
			text-shadow: 0 0 8px var(--pink);
		}
	</style>
</head>

<body>
	<div id="overlay" onclick="startGame()">
		<h2>READY TO PLAY?</h2>
		<p>Click anywhere to start</p>
	</div>

	<div class="game">
		<div class="header">
			<h1>C3 SNAKE</h1>
			<div class="controls">[ WASD or Arrow Keys ], P (PAUSE), F (FULLSCREEN)</div>
		</div>
		<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
		<div id="log"></div>
	</div>

	<div class="footer">
		Built with <a href="https://c3-lang.org/" target="_blank">C3</a> & <a
			href="https://github.com/raysan5/raylib/wiki/Working-for-Web-(HTML5)" target="_blank">Raylib</a>
	</div>

	<script>
		function startGame() {
			document.getElementById('overlay').style.display = 'none';
			if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
				var context = new (window.AudioContext || window.webkitAudioContext)();
				if (context.state === 'suspended') context.resume();
			}
			
			if (Module._start_web_game) Module._start_web_game();
		}

		var Module = {
			print: function (text) {
				console.log(text);
				var log = document.getElementById('log');
				if (log) log.innerText = text;
			},
			canvas: document.getElementById('canvas'),
			
			requestFullscreen: function(lockPointer, resizeCanvas) {
				if (this.canvas.requestFullscreen) this.canvas.requestFullscreen();
			}
		};
	</script>
	{{{ SCRIPT }}}
</body>

</html>
